<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DA7MG TV — Live</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0a0a; color:#fff;
    font-family: Arial, Helvetica, sans-serif; overflow-x:hidden; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px;
    max-width:960px; margin:0 auto; }
  header img { height:34px; width:auto; max-width:34vw; object-fit:contain; }
  header .ttl { color:#D4AF37; font-weight:bold; letter-spacing:.18em;
    font-size:clamp(15px, 4.5vw, 22px); white-space:nowrap; }
  header .live { color:#fff; background:#c00; border-radius:3px; padding:2px 7px;
    font-size:clamp(10px, 3vw, 12px); font-weight:bold; letter-spacing:.08em; }
  #playerwrap { max-width:960px; margin:0 auto; padding:0 8px; }
  #stage { position:relative; background:#000; border-radius:6px; overflow:hidden; }
  video { display:block; width:100%; height:auto; aspect-ratio:16/9;
    max-height:72vh; background:#000; }
  #tap { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    text-align:center; padding:0 12px; background:rgba(0,0,0,.55);
    font-size:clamp(16px, 5vw, 24px); color:#D4AF37; cursor:pointer; z-index:5; }
  #nowbar { max-width:960px; margin:0 auto; padding:10px 14px 2px; }
  #chan { color:#D4AF37; font-weight:bold; letter-spacing:.22em;
    font-size:clamp(11px, 3.2vw, 13px); }
  #now { font-size:clamp(17px, 5vw, 26px); font-weight:bold; margin:4px 0; line-height:1.25; }
  #next { font-size:clamp(13px, 3.8vw, 16px); color:#ccc; line-height:1.35; }
  #upnext { max-width:960px; margin:0 auto; padding:14px 14px 28px; }
  #upnext h2 { color:#D4AF37; font-size:clamp(13px, 3.8vw, 15px);
    letter-spacing:.18em; margin:8px 0 4px; }
  .row { display:flex; gap:10px; align-items:baseline; padding:6px 0;
    border-bottom:1px solid #222; font-size:13px; }
  .row .t { color:#D4AF37; min-width:76px; flex:none; font-size:12px; }
  .row .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row.on .n { font-weight:bold; }
  @media (max-width:700px){
    header { padding:8px 10px; }
    #playerwrap { padding:0; }
    #stage { border-radius:0; }
    .row { font-size:12.5px; padding:5px 0; }
    .row .t { min-width:68px; }
  }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="DA7MG">
  <span class="ttl">DA7MG TV</span>
  <span class="live">LIVE</span>
</header>
<div id="playerwrap">
  <div id="stage">
    <video id="tv" autoplay muted playsinline controls></video>
    <div id="tap">▶ TAP TO PLAY DA7MG TV</div>
  </div>
</div>
<div id="nowbar">
  <div id="chan">DA7MG TV — LIVE</div>
  <div id="now">Tuning in…</div>
  <div id="next"></div>
</div>
<div id="upnext"><h2>COMING UP</h2><div id="rows"></div></div>
<script>
const tv = document.getElementById('tv');
const nowEl = document.getElementById('now');
const nextEl = document.getElementById('next');
const tap = document.getElementById('tap');
const rowsEl = document.getElementById('rows');
let slots = [], current = -1, startedMuted = true;

function slotAt(t) {
  for (let i = 0; i < slots.length; i++) {
    if (t >= Date.parse(slots[i].start) && t < Date.parse(slots[i].end)) return i;
  }
  return -1;
}
function fmtTime(iso) {
  try { return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  catch (e) { return ''; }
}
function renderRows() {
  if (!slots.length || current < 0) return;
  let html = '';
  for (let i = current; i < Math.min(slots.length, current + 9); i++) {
    html += '<div class="row' + (i === current ? ' on' : '') + '"><span class="t">'
      + fmtTime(slots[i].start) + '</span><span class="n">'
      + slots[i].title.replace(/</g, '&lt;') + '</span></div>';
  }
  rowsEl.innerHTML = html;
}
function play(i, unmute) {
  if (i < 0 || i >= slots.length) { nowEl.textContent = 'DA7MG TV — back shortly'; return; }
  current = i;
  const s = slots[i];
  const into = Math.max(0, (Date.now() - Date.parse(s.start)) / 1000);
  nowEl.textContent = s.title;
  nextEl.textContent = slots[i + 1] ? 'Up next: ' + slots[i + 1].title : '';
  renderRows();
  tv.src = s.src;
  tv.onloadedmetadata = () => {
    try { tv.currentTime = s.seek + into; } catch (e) {}
    tv.play().then(() => { if (unmute) { tv.muted = false; } }).catch(() => {
      tap.style.display = 'flex';
    });
  };
}
tv.addEventListener('ended', () => play(current + 1, !tv.muted));
setInterval(() => { // stay glued to the broadcast clock
  const i = slotAt(Date.now());
  if (i !== -1 && i !== current) play(i, !tv.muted);
}, 4000);
tap.addEventListener('click', () => { tap.style.display = 'none'; tv.muted = false; tv.play(); });
fetch('schedule.json').then(r => r.json()).then(d => {
  slots = d.slots;
  const i = slotAt(Date.now());
  play(i === -1 ? 0 : i, false);
  // Auto-unmute on first interaction anywhere (TV remotes / clicks)
  window.addEventListener('pointerdown', () => { if (startedMuted) { tv.muted = false; startedMuted = false; } }, { once: true });
}).catch(() => { nowEl.textContent = 'DA7MG TV — lineup unavailable, refresh to retry'; });
</script>
</body>
</html>
